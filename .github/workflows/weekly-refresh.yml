name: Weekly Data Refresh

on:
  schedule:
    # Monday 06:00 UTC
    - cron: '17 3 * * 1'
  workflow_dispatch:  # allow manual trigger

concurrency:
  group: weekly-refresh
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  PYTHONUNBUFFERED: "1"
  REPOS: >-
    dotnet/runtime dotnet/roslyn dotnet/maui microsoft/aspire
    microsoft/vscode golang/go rust-lang/rust
  # Subset of REPOS that have push-event and review data fetched
  PUSH_REPOS: dotnet/runtime dotnet/roslyn dotnet/maui microsoft/aspire
  REVIEW_REPOS: dotnet/runtime dotnet/roslyn dotnet/maui microsoft/aspire

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 300  # 5 hours max

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Restore DB from CSVs
        run: python load_csv.py --force

      - name: Fetch items (incremental)
        run: python fetch.py --update --repos ${{ env.REPOS }}

      - name: Fetch merged_by
        run: python fetch_mergers.py --repos ${{ env.REPOS }}

      - name: Fetch first comments
        run: python fetch_comments.py

      - name: Fetch PR push events
        run: python fetch_pr_pushes.py --repos ${{ env.PUSH_REPOS }}

      - name: Fetch Copilot commit trailers
        run: python fetch_copilot_commits.py --repos ${{ env.REPOS }}

      - name: Fetch Copilot PR requesters
        run: python fetch_copilot_requesters.py

      - name: Fetch review timeline data
        run: python fetch_reviews.py --repos ${{ env.REVIEW_REPOS }}

      - name: Fetch issue authors (backfill, skip if few missing)
        run: |
          MISSING=$(python -c "
          import sqlite3, sys, os
          if not os.path.exists('pr-dashboard.db'):
              print('0')
              sys.exit(0)
          c = sqlite3.connect('pr-dashboard.db')
          print(c.execute('SELECT count(*) FROM items WHERE author IS NULL OR author = \"\"').fetchone()[0])
          ")
          if [ "$MISSING" -gt 100 ]; then
            echo "$MISSING items missing authors — running backfill"
            python fetch_issue_authors.py --repos ${{ env.REPOS }}
          else
            echo "Only $MISSING items missing authors — skipping backfill"
          fi

      - name: Backup DB to CSVs
        run: python backup_csvs.py

      - name: Generate charts
        run: python analyze.py

      - name: Create or update PR
        run: |
          BRANCH="auto/weekly-refresh"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Check for changes (including deletions)
          git add -A -- data/ charts/
          if git diff --cached --quiet; then
            echo "No data changes — skipping PR."
            exit 0
          fi

          # Commit and push
          git checkout -B "$BRANCH"
          DATE=$(date -u +%Y-%m-%d)
          git commit -m "Weekly data refresh ($DATE)"
          git push -f origin "$BRANCH"

          # Create or update PR
          EXISTING=$(gh pr list --head "$BRANCH" --state open --json number -q '.[0].number // empty')
          if [ -n "$EXISTING" ]; then
            echo "Updated existing PR #$EXISTING"
          else
            BODY=$(cat <<'EOF'
          Automated weekly refresh of item data, review metrics, and charts.

          This PR was created by the [weekly-refresh workflow]. Review the chart changes and merge when satisfied.
          EOF
            )
            gh pr create \
              --title "Weekly data refresh ($DATE)" \
              --body "$BODY" \
              --head "$BRANCH" \
              --base master
          fi

  notify-failure:
    runs-on: ubuntu-latest
    needs: refresh
    if: failure()
    permissions:
      issues: write
    steps:
      - name: Create issue on failure
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RUN_URL="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          # Ensure label exists
          gh label create workflow-failure --repo "${{ github.repository }}" \
            --color D93F0B --description "Automated workflow failure" 2>/dev/null || true

          # Close any previous failure issues so they don't pile up
          gh issue list \
            --repo "${{ github.repository }}" \
            --label "workflow-failure" \
            --state open \
            --json number -q '.[].number' |
          while read -r num; do
            gh issue close "$num" --repo "${{ github.repository }}" \
              --comment "Superseded by newer run: $RUN_URL"
          done

          gh issue create \
            --repo "${{ github.repository }}" \
            --title "Weekly data refresh failed ($(date -u +%Y-%m-%d))" \
            --label "workflow-failure" \
            --body "The weekly data refresh workflow failed.

          **Run:** $RUN_URL

          Check the logs for details. Common causes:
          - GitHub API rate limiting
          - Schema changes in fetch scripts
          - Transient network errors (may succeed on retry via workflow_dispatch)"
