name: Weekly Data Refresh

on:
  schedule:
    # Daily 03:17 UTC
    - cron: '17 3 * * *'
  workflow_dispatch:
    inputs:
      refresh_only:
        description: "Run only restore+analyze smoke (skip fetch stages)"
        required: false
        default: false
        type: boolean

concurrency:
  group: weekly-refresh
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  PYTHONUNBUFFERED: "1"
  # Cap each incremental catch-up to a bit more than the weekly schedule.
  UPDATE_WINDOW_DAYS: "10"
  COMMENT_MAX_PAGES: "150"
  PUSH_LIMIT: "500"
  REVIEW_LIMIT: "500"
  COPILOT_COMMITS_LIMIT: "500"
  REPOS: >-
    dotnet/runtime dotnet/roslyn dotnet/maui microsoft/aspire Azure/azure-sdk-for-js
    microsoft/vcpkg microsoft/vscode golang/go rust-lang/rust
  # Subset of REPOS that have push-event and review data fetched
  PUSH_REPOS: dotnet/runtime dotnet/roslyn dotnet/maui microsoft/aspire Azure/azure-sdk-for-js
  REVIEW_REPOS: dotnet/runtime dotnet/roslyn dotnet/maui microsoft/aspire Azure/azure-sdk-for-js

jobs:
  refresh-smoke:
    if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.refresh_only == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Restore DB from CSVs
        run: python load_csv.py --force

      - name: Generate charts
        run: python analyze.py

  # Carry the SQLite DB between stages so no single job hits the 5-hour limit.
  prepare-db:
    if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.refresh_only != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Restore DB from CSVs
        run: python load_csv.py --force

      - name: Checkpoint DB
        run: |
          python -c "import sqlite3, sys; c=sqlite3.connect('pr-dashboard.db'); row=c.execute('PRAGMA wal_checkpoint(TRUNCATE)').fetchone(); c.close(); print(f'Checkpoint result: {row}'); sys.exit(1 if not row or row[0] != 0 else 0)"

      - name: Upload DB artifact
        uses: actions/upload-artifact@v4
        with:
          name: weekly-refresh-db
          path: pr-dashboard.db
          overwrite: true

  fetch-items:
    if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.refresh_only != 'true' }}
    runs-on: ubuntu-latest
    needs: prepare-db
    timeout-minutes: 240

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Download DB artifact
        uses: actions/download-artifact@v4
        with:
          name: weekly-refresh-db
          path: db-artifact

      - name: Restore DB artifact
        run: mv db-artifact/pr-dashboard.db pr-dashboard.db

      - name: Fetch items (incremental)
        run: python fetch.py --update --update-window-days ${{ env.UPDATE_WINDOW_DAYS }} --repos ${{ env.REPOS }}

      - name: Fetch merged_by
        run: python fetch_mergers.py --repos ${{ env.REPOS }}

      - name: Checkpoint DB
        run: |
          python -c "import sqlite3, sys; c=sqlite3.connect('pr-dashboard.db'); row=c.execute('PRAGMA wal_checkpoint(TRUNCATE)').fetchone(); c.close(); print(f'Checkpoint result: {row}'); sys.exit(1 if not row or row[0] != 0 else 0)"

      - name: Upload DB artifact
        uses: actions/upload-artifact@v4
        with:
          name: weekly-refresh-db
          path: pr-dashboard.db
          overwrite: true

  fetch-engagement:
    if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.refresh_only != 'true' }}
    runs-on: ubuntu-latest
    needs: fetch-items
    timeout-minutes: 240

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Download DB artifact
        uses: actions/download-artifact@v4
        with:
          name: weekly-refresh-db
          path: db-artifact

      - name: Restore DB artifact
        run: mv db-artifact/pr-dashboard.db pr-dashboard.db

      - name: Fetch first comments
        run: python fetch_comments.py --max-pages ${{ env.COMMENT_MAX_PAGES }}

      - name: Fetch PR push events
        run: python fetch_pr_pushes.py --repos ${{ env.PUSH_REPOS }} --limit ${{ env.PUSH_LIMIT }}

      - name: Checkpoint DB
        run: |
          python -c "import sqlite3, sys; c=sqlite3.connect('pr-dashboard.db'); row=c.execute('PRAGMA wal_checkpoint(TRUNCATE)').fetchone(); c.close(); print(f'Checkpoint result: {row}'); sys.exit(1 if not row or row[0] != 0 else 0)"

      - name: Upload DB artifact
        uses: actions/upload-artifact@v4
        with:
          name: weekly-refresh-db
          path: pr-dashboard.db
          overwrite: true

  fetch-copilot-metadata:
    if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.refresh_only != 'true' }}
    runs-on: ubuntu-latest
    needs: fetch-engagement
    timeout-minutes: 240

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Download DB artifact
        uses: actions/download-artifact@v4
        with:
          name: weekly-refresh-db
          path: db-artifact

      - name: Restore DB artifact
        run: mv db-artifact/pr-dashboard.db pr-dashboard.db

      - name: Fetch Copilot commit trailers
        run: python fetch_copilot_commits.py --repos ${{ env.REPOS }} --limit ${{ env.COPILOT_COMMITS_LIMIT }}

      - name: Fetch Copilot PR requesters
        run: python fetch_copilot_requesters.py

      - name: Fetch review timeline data
        run: python fetch_reviews.py --repos ${{ env.REVIEW_REPOS }} --limit ${{ env.REVIEW_LIMIT }}

      - name: Fetch issue authors (backfill, skip if few missing)
        run: |
          MISSING=$(python -c "
          import sqlite3, sys, os
          if not os.path.exists('pr-dashboard.db'):
              print('0')
              sys.exit(0)
          c = sqlite3.connect('pr-dashboard.db')
          print(c.execute('SELECT count(*) FROM items WHERE author IS NULL OR author = \"\"').fetchone()[0])
          ")
          if [ "$MISSING" -gt 100 ]; then
            echo "$MISSING items missing authors — running backfill"
            python fetch_issue_authors.py --repos ${{ env.REPOS }}
          else
            echo "Only $MISSING items missing authors — skipping backfill"
          fi

      - name: Checkpoint DB
        run: |
          python -c "import sqlite3, sys; c=sqlite3.connect('pr-dashboard.db'); row=c.execute('PRAGMA wal_checkpoint(TRUNCATE)').fetchone(); c.close(); print(f'Checkpoint result: {row}'); sys.exit(1 if not row or row[0] != 0 else 0)"

      - name: Upload DB artifact
        uses: actions/upload-artifact@v4
        with:
          name: weekly-refresh-db
          path: pr-dashboard.db
          overwrite: true

  refresh:
    if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.refresh_only != 'true' }}
    runs-on: ubuntu-latest
    needs: fetch-copilot-metadata
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Download DB artifact
        uses: actions/download-artifact@v4
        with:
          name: weekly-refresh-db
          path: db-artifact

      - name: Restore DB artifact
        run: mv db-artifact/pr-dashboard.db pr-dashboard.db

      - name: Backup DB to CSVs
        run: python backup_csvs.py

      - name: Generate charts
        run: python analyze.py

      - name: Update HTML timestamp
        run: python update_html_timestamp.py

      - name: Verify refreshed outputs
        run: python verify_refresh_outputs.py --baseline-ref HEAD --repos ${{ env.REPOS }}

      - name: Create, update, and auto-merge PR
        if: ${{ github.ref_name == 'master' }}
        run: |
          set -euo pipefail
          BRANCH="auto/weekly-refresh"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git checkout -B "$BRANCH"

          # Check for changes (including deletions)
          git add -A -- data/ charts/
          if git diff --cached --quiet; then
            echo "No data changes — skipping PR."
            exit 0
          fi

          DATE=$(date -u +%Y-%m-%d)
          TITLE="Weekly data refresh ($DATE)"
          BODY_FILE=$(mktemp)
          trap 'rm -f "$BODY_FILE"' EXIT
          printf '%s\n' \
            '> [!NOTE]' \
            '> This pull request description was generated with AI/Copilot assistance.' \
            '' \
            'Automated refresh of item data, review metrics, and charts.' \
            '' \
            'The workflow already ran sanity checks over the refreshed CSVs and chart outputs before opening this PR.' \
            'If the branch still satisfies repository merge policy, the workflow will squash-merge this PR automatically.' \
            > "$BODY_FILE"

          # Commit and push
          git commit -m "$TITLE"
          # Fetch the existing refresh branch (if any) so --force-with-lease has
          # an up-to-date origin ref to compare against; otherwise the lease
          # check is a no-op.
          git fetch origin "$BRANCH" || true
          git push --force-with-lease origin "$BRANCH"

          # Create or update the single refresh PR
          PR_NUMBER=$(gh pr list --head "$BRANCH" --state open --json number -q '.[0].number // empty')
          if [ -n "$PR_NUMBER" ]; then
            gh pr edit "$PR_NUMBER" --title "$TITLE" --body-file "$BODY_FILE"
            echo "Updated existing PR #$PR_NUMBER"
          else
            PR_URL=$(gh pr create \
              --title "$TITLE" \
              --body-file "$BODY_FILE" \
              --head "$BRANCH" \
              --base master)
            PR_NUMBER=${PR_URL##*/}
          fi

          if [ -z "$PR_NUMBER" ]; then
            echo "Failed to determine refresh PR number."
            exit 1
          fi

          # Enable auto-merge so GitHub merges as soon as repo policy is satisfied
          # (immediately if no required checks/reviews, otherwise when they pass).
          # Don't fail the refresh job if auto-merge can't be enabled (e.g. policy
          # change) — leave the PR open for manual review instead.
          if ! gh pr merge "$PR_NUMBER" --auto --squash; then
            echo "::warning::Failed to enable auto-merge on PR #$PR_NUMBER; PR remains open for manual merge."
          fi

  notify-failure:
    if: ${{ (github.event_name != 'workflow_dispatch' || github.event.inputs.refresh_only != 'true') && always() && failure() }}
    runs-on: ubuntu-latest
    needs:
      - prepare-db
      - fetch-items
      - fetch-engagement
      - fetch-copilot-metadata
      - refresh
    permissions:
      issues: write
    steps:
      - name: Create issue on failure
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RUN_URL="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          # Ensure label exists
          gh label create workflow-failure --repo "${{ github.repository }}" \
            --color D93F0B --description "Automated workflow failure" 2>/dev/null || true

          # Close any previous failure issues so they don't pile up
          gh issue list \
            --repo "${{ github.repository }}" \
            --label "workflow-failure" \
            --state open \
            --json number -q '.[].number' |
          while read -r num; do
            gh issue close "$num" --repo "${{ github.repository }}" \
              --comment "Superseded by newer run: $RUN_URL"
          done

          gh issue create \
            --repo "${{ github.repository }}" \
            --title "Weekly data refresh failed ($(date -u +%Y-%m-%d))" \
            --label "workflow-failure" \
            --body "The weekly data refresh workflow failed.

          **Run:** $RUN_URL

          Check the logs for details. Common causes:
          - GitHub API rate limiting
          - Schema changes in fetch scripts
          - Transient network errors (may succeed on retry via workflow_dispatch)"
